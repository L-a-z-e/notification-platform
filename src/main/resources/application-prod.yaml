spring:
  datasource:
    url: jdbc:postgresql://${RDS_ENDPOINT}:5432/${RDS_DB_NAME}?reWriteBatchedInserts=true
    driver-class-name: org.postgresql.Driver
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    defer-datasource-initialization: false
  data:
    redis:
      host: ${REDIS_ENDPOINT}
      port: 6379
      password: ${REDIS_PASSWORD}
  sql:
    init:
      mode: never

spring.cloud.aws:
  region:
    static: ${AWS_REGION:ap-northeast-2}
  sqs:
    endpoint: https://sqs.${AWS_REGION:ap-northeast-2}.amazonaws.com
