server:
  port: 8090

spring:
  application:
    name: notification-platform

  datasource:
    url: jdbc:postgresql://localhost:5433/notification?reWriteBatchedInserts=true
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:app}
    password: ${POSTGRES_PASSWORD:app1234}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      leak-detection-threshold: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: true
    defer-datasource-initialization: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:redis1234}
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: notification-platform

rate-limit:
  window-seconds: 60
  max-requests: 100