server:
  port: 8090

spring:
  application:
    name: notification-platform

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      leak-detection-threshold: 30000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

notification:
  sqs:
    queue-name: notification-events

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: notification-platform

rate-limit:
  window-seconds: 60
  max-requests: 100
